name: Build and publish Foundry package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundry-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Increment patch version and pin download URL
        id: version
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("system.json", "utf8"));
          const parts = manifest.version.split(".").map(Number);
          if (parts.length !== 3 || parts.some((part) => !Number.isInteger(part))) {
            throw new Error("system.json version must use MAJOR.MINOR.PATCH");
          }
          parts[2] += 1;
          manifest.version = parts.join(".");
          manifest.download = `https://github.com/${process.env.REPOSITORY}/releases/download/v${manifest.version}/hollow-knight-rpg.zip`;
          fs.writeFileSync("system.json", JSON.stringify(manifest, null, 2) + "\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${manifest.version}\n`);
          console.log(`Pinned manifest download URL: ${manifest.download}`);
          NODE

      - name: Commit manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system.json
          git commit -m "Release v${VERSION}"
          git push origin HEAD:main

      - name: Validate manifest, localization, and JavaScript
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('system.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('lang/ru.json', 'utf8'))"
          npm test
          for file in scripts/main.js scripts/data/character-data.js scripts/data/charm-data.js scripts/data/feature-item-data.js scripts/data/technique-data.js scripts/rules/derived.js scripts/rules/charm-tracker.js scripts/rules/feature-sheet.js scripts/sheets/character-sheet.js scripts/sheets/charm-sheet.js scripts/sheets/feature-item-sheet.js; do
            node --check "$file"
          done

      - name: Build and verify Foundry package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -f hollow-knight-rpg.zip
          zip -r hollow-knight-rpg.zip system.json scripts templates styles lang

          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const expected = process.env.VERSION;
          const packaged = JSON.parse(execFileSync("unzip", ["-p", "hollow-knight-rpg.zip", "system.json"], { encoding: "utf8" }));
          if (packaged.version !== expected) {
            throw new Error(`ZIP manifest mismatch: expected ${expected}, got ${packaged.version}`);
          }
          const entries = execFileSync("unzip", ["-Z1", "hollow-knight-rpg.zip"], { encoding: "utf8" }).trim().split("\n");
          for (const required of ["system.json", "scripts/main.js", "scripts/data/charm-data.js", "scripts/data/feature-item-data.js", "scripts/data/technique-data.js", "scripts/rules/charm-tracker.js", "scripts/rules/feature-sheet.js", "scripts/sheets/character-sheet.js", "scripts/sheets/charm-sheet.js", "scripts/sheets/feature-item-sheet.js", "templates/actor/character-sheet.hbs", "templates/item/charm-sheet.hbs", "templates/item/feature-item-sheet.hbs", "styles/system.css", "lang/ru.json"]) {
            if (!entries.includes(required)) throw new Error(`Missing package entry: ${required}`);
          }
          console.log(`Verified packaged system.json version: ${packaged.version}`);
          NODE

      - name: Archive verified package
        uses: actions/upload-artifact@v4
        with:
          name: hollow-knight-rpg-v${{ steps.version.outputs.version }}
          path: hollow-knight-rpg.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" hollow-knight-rpg.zip --clobber
            gh release edit "v${VERSION}" \
              --title "Hollow Knight RPG v${VERSION}" \
              --notes "Пакет системы для Foundry VTT 13. Автоматически собран из main." \
              --latest
          else
            gh release create "v${VERSION}" hollow-knight-rpg.zip \
              --target "$(git rev-parse HEAD)" \
              --title "Hollow Knight RPG v${VERSION}" \
              --notes "Пакет системы для Foundry VTT 13. Автоматически собран из main." \
              --latest
          fi